annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: '-- Grafana --'
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
cursorSync: 'Off'
editable: true
elements:
  panel-1:
    kind: Panel
    spec:
      data:
        kind: QueryGroup
        spec:
          queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: bfog39ug7435sd
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    dataset: users
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                        now() as time,
                        numbackends as "Active Connections"
                      FROM pg_stat_database
                      WHERE datname = 'users';
                    sql:
                      columns:
                        - parameters: []
                          type: function
                      groupBy:
                        - property:
                            type: string
                          type: groupBy
                      limit: 50
                  version: v0
                refId: A
          queryOptions: {}
          transformations: []
      description: ''
      id: 1
      links: []
      title: Postgres - Active Connections
      vizConfig:
        group: stat
        kind: VizConfig
        spec:
          fieldConfig:
            defaults:
              thresholds:
                mode: absolute
                steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
            overrides: []
          options:
            colorMode: background
            graphMode: none
            justifyMode: auto
            orientation: auto
            percentChangeColorMode: standard
            reduceOptions:
              calcs:
                - lastNotNull
              fields: ''
              values: false
            showPercentChange: false
            textMode: auto
            wideLayout: true
        version: 13.0.2
  panel-2:
    kind: Panel
    spec:
      data:
        kind: QueryGroup
        spec:
          queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: bfog39ug7435sd
                  group: grafana-postgresql-datasource
                  kind: DataQuery
                  spec:
                    dataset: users
                    editorMode: code
                    format: table
                    rawQuery: true
                    rawSql: |-
                      SELECT
                        now() as time,
                        blks_read as "Disk Reads (Cache Misses)",
                        blks_hit as "Buffer Hits (Cache Success)"
                      FROM pg_stat_database
                      WHERE datname = 'users';
                    sql:
                      columns:
                        - parameters: []
                          type: function
                      groupBy:
                        - property:
                            type: string
                          type: groupBy
                      limit: 50
                  version: v0
                refId: A
          queryOptions: {}
          transformations: []
      description: ''
      id: 2
      links: []
      title: Database Activity Panel (Read/Write Load)
      vizConfig:
        group: stat
        kind: VizConfig
        spec:
          fieldConfig:
            defaults:
              thresholds:
                mode: absolute
                steps:
                  - color: green
                    value: 0
                  - color: '#EAB839'
                    value: 10010
                  - color: red
                    value: 1000000
            overrides: []
          options:
            colorMode: value
            graphMode: area
            justifyMode: auto
            orientation: auto
            percentChangeColorMode: standard
            reduceOptions:
              calcs:
                - lastNotNull
              fields: ''
              values: false
            showPercentChange: false
            textMode: auto
            wideLayout: true
        version: 13.0.2
layout:
  kind: GridLayout
  spec:
    items:
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: panel-1
          height: 8
          width: 12
          x: 0
          'y': 0
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: panel-2
          height: 8
          width: 12
          x: 12
          'y': 0
links: []
liveNow: false
preferences:
  layout:
    kind: GridLayout
    spec:
      items: []
preload: false
tags: []
timeSettings:
  autoRefresh: ''
  autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
  fiscalYearStartMonth: 0
  from: now-6h
  hideTimepicker: false
  timezone: browser
  to: now
title: Postgres
variables: []
