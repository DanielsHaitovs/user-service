apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: user-db
  name: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-db
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: user-db
    spec:
      containers:
        - args:
            - postgres
            - -c
            # - shared_buffers=4GB
            - shared_buffers=256MB
            - -c
            - work_mem=64MB
            - -c
            - maintenance_work_mem=2GB
            - -c
            - effective_cache_size=12GB
            - -c
            - max_connections=200
            - -c
            - wal_compression=on
            - -c
            - autovacuum_naptime=10s
            - -c
            - autovacuum_vacuum_cost_limit=2000
            - -c
            - autovacuum_vacuum_scale_factor=0.05
            - -c
            - random_page_cost=1.1
            - -c
            - seq_page_cost=1.0
          env:
            - name: POSTGRES_DB
              value: users
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_USER
              value: user
          envFrom:
            - configMapRef:
                name: env
          image: postgres
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          name: user-db
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            limits:
              memory: "2Gi"
      restartPolicy: Always
