---
# ==========================================
# 1. POSTGRES (user_db)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      # KUBERNETES FIX: Create a 2GB RAM disk for shm_size
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: user-db
          image: postgres:latest

          # Mount the 2GB RAM disk to Postgres's shared memory folder
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm

          resources:
            limits:
              memory: '4Gi'

          env:
            - name: POSTGRES_DB
              value: 'users'
            - name: POSTGRES_USER
              value: 'user'
            - name: POSTGRES_PASSWORD
              value: 'password'

          # KUBERNETES FIX: 'command' becomes 'args'
          args:
            - 'postgres'
            - '-c'
            - 'shared_buffers=1GB'
            - '-c'
            - 'work_mem=64MB'
            - '-c'
            - 'maintenance_work_mem=2GB'
            - '-c'
            - 'effective_cache_size=12GB'
            - '-c'
            - 'max_connections=200'
            - '-c'
            - 'wal_compression=on'
            - '-c'
            - 'autovacuum_naptime=10s'
            - '-c'
            - 'autovacuum_vacuum_cost_limit=2000'
            - '-c'
            - 'autovacuum_vacuum_scale_factor=0.05'
            - '-c'
            - 'random_page_cost=1.1'
            - '-c'
            - 'seq_page_cost=1.0'

          ports:
            - containerPort: 5432

          # Translated Docker Healthcheck
          readinessProbe:
            exec:
              command:
                ['sh', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                ['sh', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB']
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: user-db
  ports:
    - port: 5432

---
# ==========================================
# 2. REDIS (redis-cache)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
        - name: redis-cache
          image: redis:latest

          env:
            # ⚠️ REPLACE THESE WITH YOUR .ENV VALUES
            - name: REDIS_PASSWORD
              value: 'MySuperSecurePassword123'
            - name: REDIS_PORT
              value: '6379'

          args:
            - 'redis-server'
            - '--appendonly'
            - 'yes'
            - '--appendfsync'
            - 'everysec'
            - '--maxmemory'
            - '256mb'
            - '--maxmemory-policy'
            - 'allkeys-lru'
            - '--tcp-keepalive'
            - '300'
            - '--requirepass'
            - '$(REDIS_PASSWORD)' # K8s natively injects the env var here

          ports:
            - containerPort: 6379

          # Translated Docker Healthcheck
          readinessProbe:
            exec:
              command: ['sh', '-c', 'redis-cli -a $REDIS_PASSWORD ping']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'redis-cli -a $REDIS_PASSWORD ping']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis-cache
  ports:
    - port: 6379
