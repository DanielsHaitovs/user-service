apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-sys-scaler
  namespace: mec-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-sys
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  # 👇 ADD THIS ADVANCED BEHAVIOR BLOCK
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15 # 👈 Drop cooldown from 300s to 15s!
      policies:
        - type: Percent
          value: 100                 # 👈 Allow it to kill 100% of excess pods at once
          periodSeconds: 15